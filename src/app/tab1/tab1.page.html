<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Compra de productos 😼
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input 
      label="Nombre"
      labelPlacement="stacked"
      placeholder="Escribe el nombre del producto"
      [(ngModel)]="nombre">
      
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-input 
      label="Precio Unitario"
      labelPlacement="stacked"
      placeholder="Escribe el precio unitario"
      [(ngModel)]="precioUnitario">   
    </ion-input>
  </ion-item>
  
  <div style="text-align: center; margin-top: 30px;">
    <h2>CANTIDAD 😼</h2>
    <h1 style="font-size: 64px;">{{cantidad}}</h1>
    
    <ion-button 
      color="danger",
      [disabled]="cantidad==0"
      (click)="disminuir2()">
       - Disminuir -
    </ion-button>
    <ion-button (click)="aumentar2()">
       - Aumentar -
    </ion-button>
    <ion-button 
      expand="block"
      color="medium",
      (click)="reiniciar2()">
       - Reiniciar -
    </ion-button>
  </div>
  <p role="alert">{{ mensaje }}</p>
  <ion-button expand="block" (click)="enviar()">
    Enviar los datos de la compra
  </ion-button>

</ion-content>
